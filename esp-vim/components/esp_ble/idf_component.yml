# On the Tab5 (WiFi through the C6, ESP_VIM_NET_WIFI_REMOTE), Bluetooth goes
# through the C6 too: esp-hosted carries NimBLE's HCI to its controller (1.x
# brings the link up from NimBLE's transport; 2.x needs esp_ble to enable the
# controller, esp_hosted_misc.h). Required here only so the header is found;
# the version is esp_net's, which the two ends must match.
dependencies:
  # Vendored and patched (third_party/, patches/esp_hosted): the project's
  # CMakeLists adds build-deps/esp_hosted, which takes the place of this one.
  espressif/esp_hosted:
    version: "1.4.0"
    rules:
      - if: "target in [esp32p4]"
      - if: "$CONFIG{ESP_VIM_NET_WIFI_REMOTE} == True"
