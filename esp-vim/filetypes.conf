# Filetypes Vim on the device recognises.
#
# The single source of truth for filetype support. scripts/make-runtime-image.py
# reads it to (1) GENERATE /vimrt/filetype.vim with exactly these rules, and
# (2) ship only these filetypes' syntax, ftplugin and indent files.
#
# Stock Vim's filetype.vim has ~1600 rules. Every one is compiled into a regexp
# program the first time a buffer is opened, and the unused ones cost memory
# (~20 MB under the NFA engine) and flash for nothing on this device.
#
# Format: <filetype> <pattern> [<pattern> ...]
#   - filetype: a Vim filetype name; syntax/<name>.vim etc. are shipped for it
#   - patterns: Vim autocmd file patterns (*.c, Makefile, */.git/config, ...)
#   - first matching line wins, so put more specific patterns earlier
#
# To add a type without reflashing, drop a file in /fat/.vim/ftdetect/ on the
# device (standard Vim ftdetect) -- but its syntax file must exist somewhere on
# 'runtimepath' too, e.g. /fat/.vim/syntax/.
#
# Rebuild after editing: pixi run vim-build

# --- C family, and the ESP-IDF build system -----------------------------------
c           *.c *.h
cpp         *.cpp *.cc *.cxx *.c++ *.hpp *.hh *.hxx *.ino
make        Makefile makefile GNUmakefile *.mk *.mak
cmake       CMakeLists.txt *.cmake *.cmake.in
kconfig     Kconfig Kconfig.* *.kconfig
conf        sdkconfig sdkconfig.* *.conf *.cfg
dosini      *.ini .editorconfig

# --- scripting -----------------------------------------------------------------
python      *.py *.pyw *.pyi SConstruct SConscript
sh          *.sh *.bash .bashrc .bash_profile .bash_aliases .profile
zsh         *.zsh .zshrc .zshenv .zprofile
lua         *.lua
javascript  *.js *.mjs *.cjs
vim         *.vim .vimrc _vimrc vimrc gvimrc .exrc

# --- data and markup -----------------------------------------------------------
json        *.json *.geojson .babelrc
yaml        *.yaml *.yml
toml        *.toml Cargo.lock
csv         *.csv
xml         *.xml *.svg
html        *.html *.htm
css         *.css
markdown    *.md *.markdown *.mkd
sql         *.sql
text        *.txt

# --- other languages -----------------------------------------------------------
rust        *.rs
go          *.go

# --- git and friends -----------------------------------------------------------
gitcommit   COMMIT_EDITMSG MERGE_MSG TAG_EDITMSG
gitrebase   git-rebase-todo
gitconfig   .gitconfig .gitmodules */.git/config */git/config
diff        *.diff *.patch *.rej
readline    .inputrc inputrc
