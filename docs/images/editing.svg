<text x="418" y="19.0" text-anchor="middle" fill="#555" font-family="sans-serif" font-size="13">Vim on ESP32-P4: editing, with :EspInfo</text>
<text x="12.0" y="53" fill="#cd0000" xml:space="preserve" textLength="470.4" lengthAdjust="spacingAndGlyphs">&quot;&quot;&quot;Summarise a notes file: word count and TODO items.&quot;&quot;&quot;</text>
<text x="12.0" y="89" fill="#cd00cd" xml:space="preserve" textLength="50.4" lengthAdjust="spacingAndGlyphs">import</text>
<text x="62.4" y="89" fill="#1a1a1a" xml:space="preserve" textLength="756.0" lengthAdjust="spacingAndGlyphs"> sys                                                                                      </text>
<text x="12.0" y="143" fill="#af5f00" xml:space="preserve" textLength="25.2" lengthAdjust="spacingAndGlyphs">def</text>
<text x="45.6" y="143" fill="#00cdcd" xml:space="preserve" textLength="75.6" lengthAdjust="spacingAndGlyphs">summarise</text>
<text x="121.2" y="143" fill="#1a1a1a" xml:space="preserve" textLength="697.2" lengthAdjust="spacingAndGlyphs">(path):                                                                            </text>
<text x="12.0" y="161" fill="#1a1a1a" xml:space="preserve" textLength="806.4" lengthAdjust="spacingAndGlyphs">    todos = []                                                                                  </text>
<text x="12.0" y="179" fill="#1a1a1a" xml:space="preserve" textLength="100.8" lengthAdjust="spacingAndGlyphs">    words = </text>
<text x="112.8" y="179" fill="#cd0000" xml:space="preserve" textLength="8.4" lengthAdjust="spacingAndGlyphs">0</text>
<text x="45.6" y="197" fill="#af5f00" xml:space="preserve" textLength="33.6" lengthAdjust="spacingAndGlyphs">with</text>
<text x="87.6" y="197" fill="#00cdcd" xml:space="preserve" textLength="33.6" lengthAdjust="spacingAndGlyphs">open</text>
<text x="121.2" y="197" fill="#1a1a1a" xml:space="preserve" textLength="58.8" lengthAdjust="spacingAndGlyphs">(path) </text>
<text x="180.0" y="197" fill="#af5f00" xml:space="preserve" textLength="16.8" lengthAdjust="spacingAndGlyphs">as</text>
<text x="196.8" y="197" fill="#1a1a1a" xml:space="preserve" textLength="621.6" lengthAdjust="spacingAndGlyphs"> f:                                                                       </text>
<text x="79.2" y="215" fill="#af5f00" xml:space="preserve" textLength="25.2" lengthAdjust="spacingAndGlyphs">for</text>
<text x="104.4" y="215" fill="#1a1a1a" xml:space="preserve" textLength="75.6" lengthAdjust="spacingAndGlyphs"> n, line </text>
<text x="180.0" y="215" fill="#af5f00" xml:space="preserve" textLength="16.8" lengthAdjust="spacingAndGlyphs">in</text>
<text x="205.2" y="215" fill="#00cdcd" xml:space="preserve" textLength="75.6" lengthAdjust="spacingAndGlyphs">enumerate</text>
<text x="280.8" y="215" fill="#1a1a1a" xml:space="preserve" textLength="33.6" lengthAdjust="spacingAndGlyphs">(f, </text>
<text x="314.4" y="215" fill="#cd0000" xml:space="preserve" textLength="8.4" lengthAdjust="spacingAndGlyphs">1</text>
<text x="322.8" y="215" fill="#1a1a1a" xml:space="preserve" textLength="495.6" lengthAdjust="spacingAndGlyphs">):                                                         </text>
<text x="12.0" y="233" fill="#1a1a1a" xml:space="preserve" textLength="176.4" lengthAdjust="spacingAndGlyphs">            words += </text>
<text x="188.4" y="233" fill="#00cdcd" xml:space="preserve" textLength="25.2" lengthAdjust="spacingAndGlyphs">len</text>
<text x="213.6" y="233" fill="#1a1a1a" xml:space="preserve" textLength="604.8" lengthAdjust="spacingAndGlyphs">(line.split())                                                          </text>
<text x="112.8" y="251" fill="#af5f00" xml:space="preserve" textLength="16.8" lengthAdjust="spacingAndGlyphs">if</text>
<text x="138.0" y="251" fill="#cd0000" xml:space="preserve" textLength="50.4" lengthAdjust="spacingAndGlyphs">&quot;TODO&quot;</text>
<text x="196.8" y="251" fill="#af5f00" xml:space="preserve" textLength="16.8" lengthAdjust="spacingAndGlyphs">in</text>
<text x="213.6" y="251" fill="#1a1a1a" xml:space="preserve" textLength="604.8" lengthAdjust="spacingAndGlyphs"> line:                                                                  </text>
<text x="12.0" y="269" fill="#1a1a1a" xml:space="preserve" textLength="806.4" lengthAdjust="spacingAndGlyphs">                todos.append((n, line.strip()))                                                 </text>
<text x="45.6" y="287" fill="#af5f00" xml:space="preserve" textLength="50.4" lengthAdjust="spacingAndGlyphs">return</text>
<text x="96.0" y="287" fill="#1a1a1a" xml:space="preserve" textLength="722.4" lengthAdjust="spacingAndGlyphs"> words, todos                                                                         </text>
<rect x="12.0" y="292" width="806.4" height="18" fill="#1a1a1a"/>
